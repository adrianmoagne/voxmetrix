services:
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "3001:80"

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      API_PREFIX: /api
      DB_URL: mongodb://mongo:27017/voxmetrix
      JWT_SECRET: replace-with-a-local-development-secret
      JWT_EXPIRES_IN: 1d
      AUTH_COOKIE_NAME: auth_token
      ALLOWED_ORIGINS: http://localhost:3001
      FRONTEND_URL: http://localhost:3001
      PUBLIC_APP_URL: http://localhost:3001
      PUBLIC_API_URL: http://localhost:8080
      UPLOAD_DIR: /app/packages/server/data/uploads
    volumes:
      - uploads_data:/app/packages/server/data/uploads

volumes:
  mongo_data:
  uploads_data:
